<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Desk — Processos</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #111318;
    --border: #1e2330;
    --accent: #00e5a0;
    --accent2: #0077ff;
    --text: #e2e8f0;
    --muted: #64748b;
    --tag-bg: #0d1f2d;
    --tag-color: #38bdf8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    border-bottom: 1px solid var(--border);
    padding: 24px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    background: rgba(10,12,16,0.92);
    backdrop-filter: blur(12px);
    z-index: 100;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  header h1 {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  header h1 span { color: var(--accent); }

  .badge {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 20px;
  }

  /* MAIN */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  .hero {
    margin-bottom: 40px;
  }

  .hero p {
    font-size: 13px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .hero h2 {
    font-size: 36px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -1px;
  }

  .hero h2 em {
    font-style: normal;
    color: var(--accent);
  }

  /* SEARCH */
  .search-wrap {
    position: relative;
    margin-bottom: 32px;
  }

  .search-wrap svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
  }

  #search {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 16px 16px 48px;
    color: var(--text);
    font-size: 15px;
    font-family: 'Syne', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }

  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: var(--accent); }

  /* FILTER TAGS */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
  }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,229,160,0.06);
  }

  /* COUNT */
  .results-count {
    font-size: 12px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 16px;
  }

  /* CARDS */
  .cards { display: flex; flex-direction: column; gap: 2px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.15s;
  }

  .card:hover {
    border-color: rgba(0,229,160,0.3);
    background: #13171e;
  }

  .card:hover::before { opacity: 1; }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .card-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  .card-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--tag-color);
    background: var(--tag-bg);
    border: 1px solid rgba(56,189,248,0.2);
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .card-body {
    display: none;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .card.open .card-body { display: block; }

  .card-desc {
    font-size: 14px;
    color: #94a3b8;
    line-height: 1.7;
    margin-bottom: 16px;
  }

  .steps {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .steps li {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.6;
  }

  .step-num {
    background: rgba(0,229,160,0.1);
    color: var(--accent);
    border-radius: 4px;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .card-toggle {
    width: 24px; height: 24px;
    border-radius: 6px;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    color: var(--muted);
    transition: transform 0.2s, color 0.15s;
    flex-shrink: 0;
  }

  .card.open .card-toggle { transform: rotate(45deg); color: var(--accent); }

  /* EMPTY */
  .empty {
    display: none;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .empty.show { display: block; }
  .empty p { font-family: 'JetBrains Mono', monospace; font-size: 13px; margin-top: 8px; }

  /* ADD BUTTON */
  .add-btn {
    position: fixed;
    bottom: 32px;
    right: 32px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 13px;
    font-weight: 700;
    font-family: 'Syne', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 0 32px rgba(0,229,160,0.25);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .add-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 48px rgba(0,229,160,0.4);
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal h3 {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 24px;
  }

  .form-group { margin-bottom: 16px; }

  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }

  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Syne', sans-serif;
    outline: none;
    transition: border-color 0.15s;
  }

  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus { border-color: var(--accent); }

  .form-group textarea { resize: vertical; min-height: 80px; }

  .steps-input { display: flex; flex-direction: column; gap: 8px; }

  .step-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .step-row input { flex: 1; }

  .step-row button {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    width: 32px; height: 32px;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .add-step-btn {
    background: none;
    border: 1px dashed var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    width: 100%;
    transition: color 0.15s, border-color 0.15s;
  }

  .add-step-btn:hover { color: var(--accent); border-color: var(--accent); }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }

  .btn-save {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-weight: 700;
    font-family: 'Syne', sans-serif;
    cursor: pointer;
    flex: 1;
  }

  .btn-cancel {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 12px 24px;
    font-family: 'Syne', sans-serif;
    cursor: pointer;
  }

  .no-results { display: none; }

  @media (max-width: 600px) {
    header { padding: 16px; }
    main { padding: 32px 16px 80px; }
    .hero h2 { font-size: 28px; }
    .add-btn { bottom: 20px; right: 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-icon">⚡</div>
  <h1>Control <span>Desk</span></h1>
  <div class="badge">v1.0 · processos</div>
</header>

<main>
  <div class="hero">
    <p>// BASE DE CONHECIMENTO</p>
    <h2>Consulte seus <em>processos</em><br>rapidamente.</h2>
  </div>

  <div class="search-wrap">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="search" placeholder="Buscar processo..." autocomplete="off">
  </div>

  <div class="filters" id="filters"></div>

  <div class="results-count" id="count"></div>

  <div class="cards" id="cards"></div>

  <div class="empty" id="empty">
    <div style="font-size:32px">🔍</div>
    <p>Nenhum processo encontrado.</p>
  </div>
</main>

<button class="add-btn" onclick="openModal()">
  <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
    <path d="M12 5v14M5 12h14"/>
  </svg>
  Novo processo
</button>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>➕ Novo Processo</h3>
    <div class="form-group">
      <label>NOME DO PROCESSO</label>
      <input type="text" id="fName" placeholder="Ex: Abertura de turno">
    </div>
    <div class="form-group">
      <label>CATEGORIA</label>
      <input type="text" id="fCategory" placeholder="Ex: Abertura, Incidente, Fechamento...">
    </div>
    <div class="form-group">
      <label>DESCRIÇÃO RÁPIDA</label>
      <textarea id="fDesc" placeholder="Resumo do processo..."></textarea>
    </div>
    <div class="form-group">
      <label>PASSOS</label>
      <div class="steps-input" id="stepsInput">
        <div class="step-row">
          <input type="text" placeholder="Passo 1...">
          <button onclick="removeStep(this)">×</button>
        </div>
      </div>
      <button class="add-step-btn" onclick="addStep()" style="margin-top:8px">+ Adicionar passo</button>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveProcess()">Salvar</button>
    </div>
  </div>
</div>

<script>
// ── DADOS INICIAIS (exemplo — edite aqui ou use o botão "Novo processo")
let processes = [
  {
    id: 1,
    name: "E-mail de início de plantão + Login no Teams",
    category: "Abertura",
    time: "08h",
    desc: "Primeiro passo do turno da manhã: comunicar início do plantão e logar nos sistemas.",
    steps: [
      "Enviar e-mail de plantão informando horário de início e fim de turno para todas as operações",
      "Logar no Microsoft Teams"
    ],
    obs: ""
  },
  {
    id: 2,
    name: "Monitoramento no Comunix",
    category: "Monitoramento",
    time: "Contínuo",
    desc: "Acompanhar indicadores das centrais via Comunix ao longo do turno.",
    steps: [
      "Abrir os Comunix",
      "Acompanhar as centrais: TMA, Pausas, Tempo Logado, Ligações Recebidas, entre outros"
    ],
    obs: ""
  },
  {
    id: 3,
    name: "Gestão de Skills HSPM (contrato PMSP)",
    category: "Monitoramento",
    time: "08h (Ter–Sex)",
    desc: "De terça a sexta há atendimento HSPM no contrato PMSP — verificar dedicação de skills.",
    steps: [
      "Filtrar os skills HSPM no Comunix",
      "Verificar se todos os agentes estão dedicados",
      "Caso não estejam, dedicar os agentes necessários",
      "Acompanhar se há muitos agentes livres",
      "Se houver excesso, manter somente o grupo dedicado e associar os demais aos outros skills"
    ],
    obs: "Aplicável apenas de terça a sexta-feira."
  },
  {
    id: 4,
    name: "Monitoramento WFM — Demanda de Skill e Pausas",
    category: "Monitoramento",
    time: "08h e 11h",
    desc: "Verificar demandas de skill e pausas feedback no WFM para todos os contratos.",
    steps: [
      "Abrir o WFM",
      "Verificar se há demanda de skill ou pausa feedback de TODOS OS CONTRATOS",
      "Tratar as demandas dentro do tempo de tratativa de 15 minutos"
    ],
    obs: ""
  },
  {
    id: 5,
    name: "Tratamento de demandas Workforce",
    category: "Workforce",
    time: "Contínuo",
    desc: "Tratar trocas de horários, escalas e ajustes dos contratos sob responsabilidade do CCO.",
    steps: [
      "Acessar as demandas de Workforce pendentes",
      "Processar trocas de horários, escalas e demais ajustes",
      "Atender todos os contratos EXCETO: PMSP, CDHU, Defensoria, SPPREV e JC Gontijo"
    ],
    obs: "Os contratos PMSP, CDHU, Defensoria, SPPREV e JC Gontijo NÃO são tratados nesta rotina."
  },
  {
    id: 6,
    name: "Associar colaboradores Amazonas e Roraima à Ouvidoria",
    category: "Ouvidoria",
    time: "09h",
    desc: "Associar agentes das centrais de Amazonas e Roraima Energia ao skill de Ouvidoria.",
    steps: [
      "Verificar chamado aberto com as matrículas (Amazonas geralmente abre o chamado)",
      "Conferir Roraima — geralmente já fica alguém associado, mas sempre validar",
      "Associar os agentes exclusivamente em Ouvidoria ou em Todos os demais skills",
      "Realizar somente a partir das 09h, pois é quando as ligações começam a ser recebidas"
    ],
    obs: "Agentes só podem ser associados a partir das 09h. Finais de semana: verificar disponibilidade."
  },
  {
    id: 7,
    name: "Relatório ANEEL — Centrais Elétricas",
    category: "Relatório",
    time: "11h",
    desc: "Extração e envio do relatório de Nível de Serviço Diário das centrais Amazonas e Roraima.",
    steps: [
      "Acessar o sistema de relatórios",
      "Extrair o Relatório Nível de Serviço Diário Acompanhamento CCO (ANEEL) — extração mensal",
      "Encaminhar o relatório no Teams, no canal do Planejamento"
    ],
    obs: ""
  },
  {
    id: 8,
    name: "E-mail de encerramento de plantão",
    category: "Fechamento",
    time: "16h",
    desc: "Comunicar formalmente o fim do turno e registrar ocorrências pendentes.",
    steps: [
      "Verificar se há ocorrências não resolvidas durante o turno",
      "Enviar e-mail informando o fim do plantão",
      "Detalhar no e-mail qualquer ocorrência que não foi resolvida"
    ],
    obs: ""
  },
  {
    id: 9,
    name: "E-mail Canais Digitais e Testes de IA",
    category: "Final de Semana",
    time: "Todos os plantões",
    desc: "Nos finais de semana todos os plantões devem encaminhar o e-mail de Canais Digitais e Testes de IA.",
    steps: [
      "Verificar que é final de semana",
      "Preparar e encaminhar e-mail de Canais Digitais e Testes de IA"
    ],
    obs: "Obrigatório em todos os plantões de final de semana."
  },
  {
    id: 10,
    name: "Exceções e regras por contrato",
    category: "Atenção",
    time: "—",
    desc: "Regras específicas e exceções que devem ser lembradas ao longo do turno.",
    steps: [
      "MEC, Terracap, Sefaz e Defensoria: não funcionam aos finais de semana — verificar antes de monitorar",
      "CEUMA: encerra às 14h",
      "Ouvidorias AM (Amazonas) e RR (Roraima): seg.–sex. Em finais de semana, verificar disponibilidade"
    ],
    obs: "Consulte este card sempre que houver dúvidas sobre funcionamento de contratos específicos."
  }
];

let activeFilter = "Todos";

function getCategories() {
  const cats = [...new Set(processes.map(p => p.category))];
  return ["Todos", ...cats];
}

function renderFilters() {
  const el = document.getElementById("filters");
  el.innerHTML = getCategories().map(c => `
    <button class="filter-btn ${c === activeFilter ? 'active' : ''}" onclick="setFilter('${c}')">${c}</button>
  `).join('');
}

function setFilter(cat) {
  activeFilter = cat;
  renderFilters();
  renderCards();
}

function renderCards() {
  const query = document.getElementById("search").value.toLowerCase();
  const container = document.getElementById("cards");
  const empty = document.getElementById("empty");
  const count = document.getElementById("count");

  let filtered = processes.filter(p => {
    const matchFilter = activeFilter === "Todos" || p.category === activeFilter;
    const matchSearch = !query ||
      p.name.toLowerCase().includes(query) ||
      p.desc.toLowerCase().includes(query) ||
      p.category.toLowerCase().includes(query) ||
      p.steps.some(s => s.toLowerCase().includes(query));
    return matchFilter && matchSearch;
  });

  count.textContent = `${filtered.length} processo${filtered.length !== 1 ? 's' : ''} encontrado${filtered.length !== 1 ? 's' : ''}`;

  if (!filtered.length) {
    container.innerHTML = '';
    empty.classList.add('show');
    return;
  }

  empty.classList.remove('show');
  container.innerHTML = filtered.map(p => `
    <div class="card" id="card-${p.id}" onclick="toggleCard(${p.id})">
      <div class="card-header">
        <span class="card-title">${highlight(p.name, query)}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="card-tag">${p.category}</span>
          <div class="card-toggle">+</div>
        </div>
      </div>
      <div class="card-body">
        <p class="card-desc">${highlight(p.desc, query)}</p>
        <ul class="steps">
          ${p.steps.map((s,i) => `
            <li>
              <span class="step-num">${String(i+1).padStart(2,'0')}</span>
              <span>${highlight(s, query)}</span>
            </li>
          `).join('')}
        </ul>
        <div style="margin-top:16px;display:flex;gap:8px">
          <button onclick="event.stopPropagation();editProcess(${p.id})" style="background:none;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:'JetBrains Mono',monospace">✏️ Editar</button>
          <button onclick="event.stopPropagation();deleteProcess(${p.id})" style="background:none;border:1px solid rgba(255,80,80,0.2);color:#f87171;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:'JetBrains Mono',monospace">🗑 Excluir</button>
        </div>
      </div>
    </div>
  `).join('');
}

function highlight(text, query) {
  if (!query) return text;
  const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return text.replace(re, '<mark style="background:rgba(0,229,160,0.25);color:var(--accent);border-radius:2px;padding:0 2px">$1</mark>');
}

function toggleCard(id) {
  const card = document.getElementById(`card-${id}`);
  card.classList.toggle('open');
}

// MODAL
let editingId = null;

function openModal(p = null) {
  editingId = p ? p.id : null;
  document.getElementById("fName").value = p ? p.name : '';
  document.getElementById("fCategory").value = p ? p.category : '';
  document.getElementById("fDesc").value = p ? p.desc : '';
  const si = document.getElementById("stepsInput");
  si.innerHTML = '';
  const steps = p ? p.steps : [''];
  steps.forEach(s => addStep(s));
  document.getElementById("modalOverlay").classList.add('show');
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove('show');
}

function addStep(val = '') {
  const si = document.getElementById("stepsInput");
  const row = document.createElement('div');
  row.className = 'step-row';
  row.innerHTML = `<input type="text" placeholder="Descreva o passo..." value="${val}"><button onclick="removeStep(this)">×</button>`;
  si.appendChild(row);
}

function removeStep(btn) {
  const si = document.getElementById("stepsInput");
  if (si.children.length > 1) btn.parentElement.remove();
}

function saveProcess() {
  const name = document.getElementById("fName").value.trim();
  const category = document.getElementById("fCategory").value.trim();
  const desc = document.getElementById("fDesc").value.trim();
  const steps = [...document.querySelectorAll("#stepsInput input")]
    .map(i => i.value.trim()).filter(Boolean);

  if (!name || !category) { alert("Nome e categoria são obrigatórios!"); return; }

  if (editingId) {
    const idx = processes.findIndex(p => p.id === editingId);
    processes[idx] = { ...processes[idx], name, category, desc, steps };
  } else {
    processes.push({ id: Date.now(), name, category, desc, steps });
  }

  closeModal();
  renderFilters();
  renderCards();
}

function editProcess(id) {
  const p = processes.find(p => p.id === id);
  openModal(p);
}

function deleteProcess(id) {
  if (!confirm("Excluir este processo?")) return;
  processes = processes.filter(p => p.id !== id);
  renderFilters();
  renderCards();
}

// SEARCH
document.getElementById("search").addEventListener("input", renderCards);

// CLOSE MODAL ON OVERLAY CLICK
document.getElementById("modalOverlay").addEventListener("click", function(e) {
  if (e.target === this) closeModal();
});

// INIT
renderFilters();
renderCards();
</script>
</body>
</html>
